[package]
name = "forms"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"

[dependencies]
askama = "0.16.0"
axum = "0.8.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
form_urlencoded = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.17", features = ["v4"] }
